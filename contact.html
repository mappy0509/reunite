<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - Reunite Group</title>
    <meta name="theme-color" content="#0c0c0d">
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>

    <div id="header-placeholder"></div>

    <main>

        <section id="contact" class="page-section">
            <header class="page-head" data-title="CONTACT">
                <div class="wrap">
                    <h2 class="page-head__title">CONTACT</h2>
                    <p class="page-head__lead">
                        グループへのお問い合わせ、採用へのご応募、その他ご相談はこちらのフォームよりご連絡ください。
                    </p>
                </div>
            </header>

            <div class="wrap--narrow section">
                <form action="#" method="POST" class="form reveal">
                    <div class="field">
                        <label for="name">お名前 *</label>
                        <input type="text" id="name" name="name" required placeholder="例: 山田 太郎">
                    </div>
                    <div class="field">
                        <label for="email">メールアドレス *</label>
                        <input type="email" id="email" name="email" required placeholder="sota.noah@icloud.com">
                    </div>
                    <div class="field">
                        <label for="phone">電話番号</label>
                        <input type="tel" id="phone" name="phone" placeholder="090-1234-5678">
                    </div>
                    <div class="field">
                        <label for="subject">件名 *</label>
                        <select id="subject" name="subject" required>
                            <option value="">選択してください</option>
                            <option value="採用について">採用について (飲食部門)</option>
                            <option value="採用について">採用について (one eighth / インフルエンサー)</option>
                            <option value="事業について">事業について（SYKTSR）</option>
                            <option value="事業について">事業について（one eighth）</option>
                            <option value="事業について">事業について（OTHER）</option>
                            <option value="提携について">提携について</option>
                            <option value="メディアについて">メディア・取材について</option>
                            <option value="その他">その他のお問い合わせ</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="message">お問い合わせ内容 *</label>
                        <textarea id="message" name="message" rows="6" required placeholder="お問い合わせ内容をご入力ください..."></textarea>
                    </div>
                    <div class="form__submit">
                        <button type="submit" class="btn">
                            送信する
                        </button>
                    </div>
                </form>
            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js" defer></script>

</body>
</html>
