<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUMAMOTO - Reunite Group</title>
    <meta name="theme-color" content="#0c0c0d">
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>

    <div id="header-placeholder"></div>

    <main>

        <section id="kumamoto" class="page-section">
            <header class="page-head" data-title="KUMAMOTO">
                <div class="wrap">
                    <h2 class="page-head__title">KUMAMOTO</h2>
                    <p class="page-head__sub">熊本の店舗</p>
                </div>
            </header>

            <div class="wrap section">
                <div class="entries">

                <article class="entry reveal">
                    <figure class="plate plate--cern">
                        <img src="img/cern_logo.png" alt="BAR CERN ロゴ" loading="lazy" decoding="async">
                        <span>BAR CERN</span>
                    </figure>
                    <div class="entry__body">
                        <span class="tag">2026年12月 OPEN</span>
                        <h3 class="entry__title">BAR CERN</h3>
                        <p class="entry__text">
                            熊本・下通のバー。<br>
                            「特別な時間を、特別な空間で」。飲み放題プランもご用意しています。
                        </p>
                        <div class="facts">
                            <p><i class="ic ic-pin" aria-hidden="true"></i> <strong>所在地:</strong><br>熊本市中央区下通1丁目10<br>TM47ビル501</p>
                            <p><i class="ic ic-clock" aria-hidden="true"></i> <strong>営業時間:</strong><br>23:00 〜 5:00</p>
                        </div>
                    </div>
                </article>

                </div>
            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js" defer></script>

</body>
</html>
